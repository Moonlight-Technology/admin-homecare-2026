# Local development services. Run `docker compose up -d` before `pnpm dev:api`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nakes
      POSTGRES_PASSWORD: nakes
      POSTGRES_DB: nakes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # S3-compatible storage for trying STORAGE_DRIVER=s3 locally. Console: http://localhost:9001 (nakes / nakes-minio-dev).
  # .env: S3_ENDPOINT=http://localhost:9000, S3_REGION=us-east-1, S3_FORCE_PATH_STYLE=true, S3_BUCKET=nakes-documents,
  #       S3_ACCESS_KEY_ID=nakes, S3_SECRET_ACCESS_KEY=nakes-minio-dev
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nakes
      MINIO_ROOT_PASSWORD: nakes-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Creates the private bucket once MinIO is up; anonymous access stays off.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 nakes nakes-minio-dev; do sleep 1; done;
      mc mb --ignore-existing local/nakes-documents;
      mc anonymous set none local/nakes-documents;
      "

volumes:
  postgres-data:
  minio-data:
