# Local development services. Run `docker compose up -d` before `pnpm dev:api`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nakes
      POSTGRES_PASSWORD: nakes
      POSTGRES_DB: nakes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Development only. For the server use deploy/minio/compose.yml and its installation guide.
  # Build pinned upstream source: Community images are no longer published reliably.
  minio:
    image: nakes-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: ./deploy/minio
      target: server
    # Keep existing development named volumes compatible. The production compose runs as UID 10001.
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nakes
      MINIO_ROOT_PASSWORD: nakes-minio-root-development-password-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/ready]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket once MinIO is up; anonymous access stays off.
  minio-setup:
    image: nakes-minio-client:RELEASE.2025-08-13T08-35-41Z
    build:
      context: ./deploy/minio
      target: client
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: nakes
      MINIO_ROOT_PASSWORD: nakes-minio-root-development-password-only
      MINIO_APP_USER: nakes-documents-api
      MINIO_APP_PASSWORD: nakes-minio-app-development-password-only
      MINIO_BUCKET: nakes-documents
    entrypoint: [/bin/sh, /scripts/init.sh]
    volumes:
      - ./deploy/minio/init.sh:/scripts/init.sh:ro
      - ./deploy/minio/app-policy.json:/scripts/app-policy.json:ro

volumes:
  postgres-data:
  minio-data:
