name: nakes-storage

x-client: &client
  image: nakes-minio-client:${MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
  build:
    context: .
    target: client
    args:
      MC_VERSION: ${MC_VERSION:-RELEASE.2025-08-13T08-35-41Z}
  user: "10001:10001"
  read_only: true
  tmpfs:
    - /tmp:mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  networks: [storage]
  environment: &client-env
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/minio/.env}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/minio/.env}
    MINIO_BUCKET: ${MINIO_BUCKET:-nakes-documents}
    MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER in deploy/minio/.env}
    MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in deploy/minio/.env}
  depends_on:
    minio:
      condition: service_healthy

services:
  minio:
    image: nakes-minio:${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    build:
      context: .
      target: server
      args:
        MINIO_VERSION: ${MINIO_VERSION:-RELEASE.2025-10-15T17-29-55Z}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 60s
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in deploy/minio/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in deploy/minio/.env}
      MINIO_REGION_NAME: us-east-1
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - type: bind
        source: ${MINIO_DATA_DIR:-/srv/nakes/minio/data}
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [storage]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    <<: *client
    profiles: [setup]
    restart: "no"
    entrypoint: [/bin/sh, /scripts/init.sh]
    volumes:
      - ./init.sh:/scripts/init.sh:ro
      - ./app-policy.json:/scripts/app-policy.json:ro

  mc:
    <<: *client
    profiles: [tools]
    entrypoint: [/bin/sh, /scripts/admin.sh]
    volumes:
      - ./admin.sh:/scripts/admin.sh:ro

networks:
  storage:
    name: nakes-storage
    driver: bridge
